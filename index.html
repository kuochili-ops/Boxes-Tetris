<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>𓃥 白六紙箱俄羅斯方塊</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <!-- Three.js r128 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls & GLTFExporter for Three.js r128 -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #141210;
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      color: #f5f2eb;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Glassmorphism UI */
    .glass-panel {
      background: rgba(28, 24, 20, 0.74);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(214, 180, 138, 0.24);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }

    /* Arcade Button Tactile Feel */
    .arcade-btn {
      background: linear-gradient(180deg, rgba(64, 54, 44, 0.92) 0%, rgba(38, 32, 26, 0.96) 100%);
      border: 1px solid rgba(214, 180, 138, 0.35);
      box-shadow: 0 4px 0 rgba(15, 12, 10, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: transform 0.06s ease, box-shadow 0.06s ease, background 0.15s ease;
    }
    .arcade-btn:active, .arcade-btn.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(15, 12, 10, 0.9), inset 0 1px 2px rgba(0, 0, 0, 0.4);
      background: linear-gradient(180deg, rgba(84, 70, 56, 0.96) 0%, rgba(52, 43, 35, 0.98) 100%);
    }

    .arcade-btn-accent {
      background: linear-gradient(180deg, #d97706 0%, #b45309 100%);
      border: 1px solid rgba(253, 224, 71, 0.45);
      box-shadow: 0 4px 0 #78350f, inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }
    .arcade-btn-accent:active, .arcade-btn-accent.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #78350f;
    }

    /* Semi-transparent Floating D-Pad & Rotate Overlay Buttons */
    .hud-translucent-btn {
      background: rgba(28, 24, 20, 0.36);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid rgba(253, 230, 138, 0.34);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.16);
      color: rgba(254, 243, 199, 0.92);
      transition: transform 0.06s ease, background 0.12s ease, border-color 0.12s ease;
    }
    .hud-translucent-btn:active, .hud-translucent-btn.pressed {
      transform: scale(0.93);
      background: rgba(217, 119, 6, 0.5);
      border-color: rgba(253, 224, 71, 0.8);
      color: #ffffff;
    }

    /* Score Popup Animation */
    @keyframes floatScore {
      0% { opacity: 0; transform: translate(-50%, 10px) scale(0.8); }
      20% { opacity: 1; transform: translate(-50%, -10px) scale(1.1); }
      80% { opacity: 1; transform: translate(-50%, -35px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -55px) scale(0.95); }
    }
    .score-popup {
      animation: floatScore 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Toast Notification */
    @keyframes slideDown {
      0% { opacity: 0; transform: translate(-50%, -20px); }
      15% { opacity: 1; transform: translate(-50%, 0); }
      85% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -20px); }
    }
    .toast-anim {
      animation: slideDown 2.6s ease forwards;
    }
  </style>
</head>
<body>

  <!-- 3D WebGL Viewport -->
  <div id="canvas-container"></div>

  <!-- Floating Score Popup Layer -->
  <div id="popup-layer" class="fixed inset-0 pointer-events-none z-20 overflow-hidden"></div>

  <!-- Toast Message Box -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none"></div>

  <!-- Top Header Bar -->
  <header class="fixed top-0 left-0 right-0 z-30 p-2 sm:p-4 flex items-start justify-between pointer-events-none">
    <!-- Title & Quick Stats -->
    <div class="glass-panel rounded-2xl px-3.5 py-2.5 sm:px-5 sm:py-3 pointer-events-auto flex flex-col gap-1.5 max-w-[65%] sm:max-w-none">
      <div class="flex items-center gap-2">
        <span class="text-xl sm:text-2xl leading-none">𓃥</span>
        <h1 class="text-sm sm:text-lg font-black tracking-wide text-amber-100 truncate">白六紙箱俄羅斯方塊</h1>
      </div>
      <div class="flex items-center gap-3 sm:gap-5 text-xs sm:text-sm">
        <div>
          <span class="text-stone-400 text-[10px] sm:text-xs block">分數 SCORE</span>
          <span id="ui-score" class="font-extrabold text-amber-400 text-sm sm:text-lg tabular-nums">0</span>
        </div>
        <div class="h-6 w-px bg-stone-700/80"></div>
        <div>
          <span class="text-stone-400 text-[10px] sm:text-xs block">等級 LV</span>
          <span id="ui-level" class="font-bold text-stone-100 text-sm sm:text-base tabular-nums">1</span>
        </div>
        <div class="h-6 w-px bg-stone-700/80"></div>
        <div>
          <span class="text-stone-400 text-[10px] sm:text-xs block">消除 LINES</span>
          <span id="ui-lines" class="font-bold text-stone-100 text-sm sm:text-base tabular-nums">0</span>
        </div>
      </div>
    </div>

    <!-- Collapsible Right Tools -->
    <div class="flex flex-col items-end gap-2 pointer-events-auto">
      <!-- Action Pills -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button id="btn-bgm" title="背景音樂開關" class="glass-panel hover:bg-stone-800/80 active:scale-95 transition rounded-xl p-2 sm:px-3 sm:py-2 text-xs sm:text-sm font-semibold flex items-center gap-1.5">
          <span id="icon-bgm">🎵</span>
          <span class="hidden sm:inline" id="label-bgm">音樂</span>
        </button>
        <button id="btn-mute" title="音效開關" class="glass-panel hover:bg-stone-800/80 active:scale-95 transition rounded-xl p-2 sm:px-3 sm:py-2 text-xs sm:text-sm font-semibold flex items-center gap-1.5">
          <span id="icon-sound">🔊</span>
          <span class="hidden sm:inline" id="label-sound">音效</span>
        </button>
        <button id="btn-pause" title="暫停 (P)" class="glass-panel hover:bg-stone-800/80 active:scale-95 transition rounded-xl p-2 sm:px-3 sm:py-2 text-xs sm:text-sm font-semibold flex items-center gap-1.5">
          <span id="icon-pause">⏸️</span>
          <span class="hidden sm:inline" id="label-pause">暫停</span>
        </button>
        <button id="btn-toggle-panel" title="展開/收合工具箱" class="glass-panel hover:bg-stone-800/80 active:scale-95 transition rounded-xl p-2 sm:px-3 sm:py-2 text-xs sm:text-sm font-semibold flex items-center gap-1">
          <span>⚙️</span>
          <span class="hidden sm:inline">工具</span>
        </button>
      </div>

      <!-- Collapsible Floating Control Drawer -->
      <div id="tools-drawer" class="glass-panel rounded-2xl p-3 flex flex-col gap-2 w-52 sm:w-60 transition-all duration-200 origin-top-right">
        <div class="text-[11px] font-bold uppercase tracking-wider text-amber-300/90 flex items-center justify-between">
          <span>📦 倉儲工作台控制</span>
        </div>

        <button id="btn-bgm-drawer" class="w-full py-2 px-3 rounded-xl bg-stone-800/90 hover:bg-stone-700/90 border border-stone-600/50 text-xs font-semibold flex items-center justify-between transition">
          <span>🎵 BGM 經典配樂</span>
          <span id="bgm-mode-badge" class="px-1.5 py-0.5 rounded bg-emerald-600/30 text-emerald-300 text-[10px]">開啟</span>
        </button>

        <button id="btn-sfx-drawer" class="w-full py-2 px-3 rounded-xl bg-stone-800/90 hover:bg-stone-700/90 border border-stone-600/50 text-xs font-semibold flex items-center justify-between transition">
          <span>🔊 紙箱碰撞音效</span>
          <span id="sfx-mode-badge" class="px-1.5 py-0.5 rounded bg-emerald-600/30 text-emerald-300 text-[10px]">開啟</span>
        </button>

        <button id="btn-control-mode" class="w-full py-2 px-3 rounded-xl bg-stone-800/90 hover:bg-stone-700/90 border border-amber-500/40 text-xs font-semibold flex items-center justify-between transition">
          <span>🎮 操控面板模式</span>
          <span id="control-mode-badge" class="px-1.5 py-0.5 rounded bg-amber-600/35 text-amber-200 text-[10px]">半透明方向鍵</span>
        </button>

        <button id="btn-camera-toggle" class="w-full py-2 px-3 rounded-xl bg-stone-800/90 hover:bg-stone-700/90 border border-stone-600/50 text-xs font-semibold flex items-center justify-between transition">
          <span>🎥 自由視角旋轉</span>
          <span id="camera-mode-badge" class="px-1.5 py-0.5 rounded bg-emerald-600/30 text-emerald-300 text-[10px]">開啟</span>
        </button>

        <button id="btn-reset-cam" class="w-full py-2 px-3 rounded-xl bg-stone-800/90 hover:bg-stone-700/90 border border-stone-600/50 text-xs font-semibold flex items-center justify-between transition">
          <span>🎯 重置標準視角</span>
          <span class="text-stone-400 text-[10px]">R</span>
        </button>

        <button id="btn-export-glb" class="w-full py-2 px-3 rounded-xl bg-amber-700/80 hover:bg-amber-600/90 border border-amber-400/40 text-xs font-bold text-amber-50 flex items-center justify-between transition shadow-md">
          <span>📥 匯出 GLB 模型</span>
          <span class="text-amber-200 text-[10px]">.glb</span>
        </button>

        <button id="btn-restart-top" class="w-full py-2 px-3 rounded-xl bg-rose-900/60 hover:bg-rose-800/80 border border-rose-500/40 text-xs font-semibold text-rose-100 flex items-center justify-between transition">
          <span>🔄 重新開局</span>
          <span class="text-rose-300 text-[10px]">NEW</span>
        </button>

        <div class="border-t border-stone-700/70 pt-2 text-[10px] text-stone-400 leading-relaxed hidden sm:block">
          <div><b class="text-stone-200">← →</b> 移動 ｜ <b class="text-stone-200">↑ / X</b> 旋轉</div>
          <div><b class="text-stone-200">↓</b> 緩降 ｜ <b class="text-stone-200">Space</b> 直落</div>
          <div><b class="text-stone-200">C / Shift</b> 暫存紙箱</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Left 2D Mini Canvas Previews for HOLD and NEXT -->
  <div class="fixed left-2.5 sm:left-4 top-24 sm:top-28 z-20 flex flex-col gap-2.5 pointer-events-none">
    <!-- HOLD Slot -->
    <div class="glass-panel rounded-2xl p-2 sm:p-2.5 flex flex-col items-center w-20 sm:w-24 pointer-events-auto cursor-pointer" id="hold-box-ui" title="暫存方塊 (C)">
      <span class="text-[10px] sm:text-xs font-bold tracking-wider text-stone-300 mb-1">暫存 HOLD</span>
      <canvas id="canvas-hold" width="76" height="56" class="w-16 h-12 sm:w-20 sm:h-14 rounded-lg bg-stone-950/50"></canvas>
    </div>

    <!-- NEXT Slot -->
    <div class="glass-panel rounded-2xl p-2 sm:p-2.5 flex flex-col items-center w-20 sm:w-24">
      <span class="text-[10px] sm:text-xs font-bold tracking-wider text-amber-300 mb-1">下一個 NEXT</span>
      <canvas id="canvas-next" width="76" height="56" class="w-16 h-12 sm:w-20 sm:h-14 rounded-lg bg-stone-950/50"></canvas>
    </div>
  </div>

  <!-- Mode 2: Classic Bottom 6-Button Arcade Controls (Hidden when Translucent D-Pad Mode is active) -->
  <div id="arcade-controls" class="hidden fixed bottom-3 sm:bottom-5 left-0 right-0 z-40 px-2 sm:px-6 flex items-end justify-between gap-1 max-w-3xl mx-auto pointer-events-none">
    <!-- Left Cluster -->
    <div class="flex items-center gap-1 sm:gap-2.5 pointer-events-auto">
      <button id="ctrl-left" class="arcade-btn w-[48px] h-14 sm:w-16 sm:h-16 rounded-xl sm:rounded-2xl flex flex-col items-center justify-center text-stone-100">
        <svg class="w-5 h-5 sm:w-7 sm:h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        <span class="text-[9px] sm:text-[10px] text-stone-400 font-semibold">左移</span>
      </button>
      <button id="ctrl-down" class="arcade-btn w-[48px] h-14 sm:w-16 sm:h-16 rounded-xl sm:rounded-2xl flex flex-col items-center justify-center text-stone-100">
        <svg class="w-5 h-5 sm:w-7 sm:h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
        <span class="text-[9px] sm:text-[10px] text-stone-400 font-semibold">緩降</span>
      </button>
      <button id="ctrl-right" class="arcade-btn w-[48px] h-14 sm:w-16 sm:h-16 rounded-xl sm:rounded-2xl flex flex-col items-center justify-center text-stone-100">
        <svg class="w-5 h-5 sm:w-7 sm:h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        <span class="text-[9px] sm:text-[10px] text-stone-400 font-semibold">右移</span>
      </button>
    </div>

    <!-- Right Cluster -->
    <div class="flex items-center gap-1 sm:gap-2.5 pointer-events-auto">
      <button id="ctrl-hold" class="arcade-btn w-[44px] h-14 sm:w-14 sm:h-16 rounded-xl sm:rounded-2xl flex flex-col items-center justify-center text-amber-200">
        <span class="text-sm sm:text-lg font-black leading-none">📦</span>
        <span class="text-[9px] sm:text-[10px] text-stone-300 font-semibold mt-1">暫存</span>
      </button>
      <button id="ctrl-rotate" class="arcade-btn w-[48px] h-14 sm:w-16 sm:h-16 rounded-xl sm:rounded-2xl flex flex-col items-center justify-center text-sky-200">
        <svg class="w-5 h-5 sm:w-7 sm:h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-3-6.7L21 8m0-5v5h-5"/></svg>
        <span class="text-[9px] sm:text-[10px] text-stone-300 font-semibold">旋轉</span>
      </button>
      <button id="ctrl-drop" class="arcade-btn-accent w-[50px] h-14 sm:w-16 sm:h-16 rounded-xl sm:rounded-2xl flex flex-col items-center justify-center text-white">
        <svg class="w-5 h-5 sm:w-7 sm:h-7" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 13l-7 7-7-7m14-8l-7 7-7-7"/></svg>
        <span class="text-[9px] sm:text-[10px] text-amber-100 font-bold">直落</span>
      </button>
    </div>
  </div>

  <!-- Mode 1 (Default): Semi-Transparent Overlay Control Panel (Topmost UI Layer: Bottom-Left D-Pad & Bottom-Right Clockwise Rotate) -->
  <div id="translucent-controls" class="fixed inset-0 z-40 pointer-events-none">
    <!-- Bottom-Left: Semi-Transparent Up/Down/Left/Right D-Pad (Up = Hard Drop) -->
    <div class="fixed bottom-4 left-4 sm:bottom-6 sm:left-6 pointer-events-auto">
      <div class="grid grid-cols-3 grid-rows-3 gap-1.5 w-36 h-36 sm:w-44 sm:h-44">
        <!-- Row 1: Up (Hard Drop) -->
        <div></div>
        <button id="dpad-up" title="直接掉落 (Hard Drop)" class="hud-translucent-btn rounded-2xl flex flex-col items-center justify-center">
          <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/></svg>
          <span class="text-[9px] sm:text-[10px] font-bold tracking-tight text-amber-200/90 -mt-0.5">直落</span>
        </button>
        <div></div>

        <!-- Row 2: Left & Right -->
        <button id="dpad-left" title="左移" class="hud-translucent-btn rounded-2xl flex items-center justify-center">
          <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div class="rounded-2xl bg-stone-900/20 border border-amber-200/15 flex items-center justify-center">
          <div class="w-2.5 h-2.5 rounded-full bg-amber-200/35"></div>
        </div>
        <button id="dpad-right" title="右移" class="hud-translucent-btn rounded-2xl flex items-center justify-center">
          <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </button>

        <!-- Row 3: Down (Soft Drop) -->
        <div></div>
        <button id="dpad-down" title="緩降" class="hud-translucent-btn rounded-2xl flex flex-col items-center justify-center">
          <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          <span class="text-[9px] sm:text-[10px] font-semibold text-stone-200/80 -mt-0.5">緩降</span>
        </button>
        <div></div>
      </div>
    </div>

    <!-- Bottom-Right: Semi-Transparent Clockwise Rotate Button (+ discreet Hold pill above) -->
    <div class="fixed bottom-5 right-4 sm:bottom-7 sm:right-7 flex flex-col items-center gap-3 pointer-events-auto">
      <button id="dpad-hold" title="暫存紙箱 (Hold)" class="hud-translucent-btn px-3.5 py-1.5 rounded-full flex items-center gap-1 text-xs font-bold">
        <span>📦</span>
        <span>暫存</span>
      </button>
      <button id="dpad-rotate" title="順時鐘旋轉" class="hud-translucent-btn w-20 h-20 sm:w-24 sm:h-24 rounded-full flex flex-col items-center justify-center">
        <svg class="w-9 h-9 sm:w-11 sm:h-11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-3-6.7L21 8m0-5v5h-5" />
        </svg>
        <span class="text-[10px] sm:text-xs font-bold tracking-wide text-amber-100/95 mt-0.5">順時鐘旋轉</span>
      </button>
    </div>
  </div>

  <!-- Start / Pause / Game Over Modal Overlay -->
  <div id="modal-overlay" class="fixed inset-0 z-50 bg-black/65 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass-panel rounded-3xl p-6 sm:p-8 max-w-md w-full text-center flex flex-col items-center gap-4 border-amber-400/35">
      <div class="w-16 h-16 rounded-2xl bg-amber-600/25 border border-amber-400/40 flex items-center justify-center text-4xl shadow-inner">
        📦
      </div>
      <div>
        <h2 id="modal-title" class="text-2xl sm:text-3xl font-black text-amber-100 tracking-wide">𓃥 白六紙箱俄羅斯方塊</h2>
        <p id="modal-subtitle" class="text-xs sm:text-sm text-stone-300 mt-2 leading-relaxed">
          將手工刷色、封箱膠帶與物流條碼的立方體瓦楞紙箱精準堆疊！可自由拖曳旋轉 3D 倉庫視角檢視懸空背板與投影，並匯出 <span class="text-amber-300 font-bold">.glb</span> 模型。
        </p>
      </div>

      <!-- Final Score Box (Hidden on initial start) -->
      <div id="modal-stats" class="hidden w-full grid grid-cols-3 gap-2 bg-stone-950/60 rounded-2xl p-3 border border-stone-700/60">
        <div>
          <div class="text-[10px] text-stone-400">最終分數</div>
          <div id="final-score" class="text-lg font-black text-amber-400">0</div>
        </div>
        <div>
          <div class="text-[10px] text-stone-400">達成等級</div>
          <div id="final-level" class="text-lg font-black text-stone-100">1</div>
        </div>
        <div>
          <div class="text-[10px] text-stone-400">消除行數</div>
          <div id="final-lines" class="text-lg font-black text-stone-100">0</div>
        </div>
      </div>

      <div class="w-full flex flex-col gap-2.5 mt-1">
        <button id="btn-modal-primary" class="arcade-btn-accent w-full py-3.5 rounded-2xl font-black text-base sm:text-lg text-white tracking-wider cursor-pointer">
          開始堆疊紙箱
        </button>
        <button id="btn-modal-export" class="hidden w-full py-2.5 rounded-2xl bg-stone-800/90 hover:bg-stone-700/90 border border-amber-400/35 text-xs sm:text-sm font-bold text-amber-200 cursor-pointer transition">
          📥 匯出當前 3D 紙箱堆疊 (.glb)
        </button>
      </div>
    </div>
  </div>

  <script>
    // Global runtime error safeguard

    // --- 1. GAME CONSTANTS & TETROMINO DEFINITIONS ---
